<!DOCTYPE html>
<html>
<head>
    <title>AI Water Quality Prediction</title>

    <link rel="stylesheet"
          href="static/css/style.css">
</head>

<body>

<div class="container">

    <h1>AI Water Quality Prediction</h1>

    <p class="subtitle">
        Predict Water Quality Index using Machine Learning
    </p>

    <form method="POST">

        <label>Temperature</label>
        <input type="number" step="any" name="Temp" required>

        <label>Dissolved Oxygen (mg/L)</label>
        <input type="number" step="any" name="DO" required>

        <label>pH</label>
        <input type="number" step="any" name="PH" required>

        <label>Conductivity (µmhos/cm)</label>
        <input type="number" step="any" name="Conductivity" required>

        <label>BOD (mg/L)</label>
        <input type="number" step="any" name="BOD" required>

        <label>Nitrate + Nitrite (mg/L)</label>
        <input type="number" step="any" name="Nitrate" required>

        <label>Total Coliform (MPN/100ml)</label>
        <input type="number" step="any" name="Coliform" required>

        <button type="submit">
            Predict Water Quality
        </button>

    </form>


{% if prediction is not none %}

<div class="result">

    <div class="wqi">
        Predicted WQI: {{ prediction }}
    </div>

    <div class="category">
        Water Quality Category: {{ category }}
    </div>

</div>

<div class="ai-explanation">

    <h2>🤖 AI Water Quality Explanation</h2>

    <h3>Why is the water quality {{ category }}?</h3>

    <p>{{ explanation }}</p>

</div>

{% endif %}

</div>

</body>
</html>
